# Scaffolded by `brew tap-new`, then cut down to what a cask-only tap needs.
#
# What went, and why: `brew pr-pull` and `brew bump --formulae` are both bottle
# workflows, and a cask has no bottles. The Ubuntu leg went with them — the
# cask here declares `depends_on macos:`, so there is nothing for Linux to say
# about it.
#
# What stayed is the check worth having: does the cask parse, and does it pass
# the same style rules Homebrew applies to its own.
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    runs-on: macos-26
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: macos-26-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: macos-26-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      # `brew test-bot --only-tap-syntax` would run all three of these, but it
      # gives no way to pass flags to the audit, and this tap needs one — see
      # the audit step below.
      - run: brew style cmrd-consulting/tap

      - run: brew readall --aliases --os=all --arch=all cmrd-consulting/tap

      # token_conflicts is excluded because it is true and unfixable: the name
      # `ratify` belongs to an unrelated homebrew/core formula (the CNCF
      # Artifact Ratification Framework, ratify.dev). Renaming the cask would
      # silence it at the cost of the product's own name, and the conflict has
      # no consequence here — the cask is installed by its full name,
      # `cmrd-consulting/tap/ratify`, and a private-source cask could never be
      # submitted to homebrew-cask core where the collision would matter.
      #
      # Every other audit rule still runs. Only this one is waived, and only
      # for as long as the collision exists.
      - run: brew audit --except=installed,token_conflicts --tap=cmrd-consulting/tap
